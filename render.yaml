# Render blueprint for the Slate sign-in service (free plan, no database).
services:
  - type: web
    name: slate-auth
    runtime: node
    plan: free
    rootDir: server
    buildCommand: "true"
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: YT_API_KEY
        sync: false
