# Render blueprint for the Slate sign-in service (free plan, no database).
# Only the backend/ folder is built and run; the web app (frontend/) is deployed on Vercel.
services:
  - type: web
    name: slate-auth
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: "true"
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
