name: Keep auth server awake

# Backup pinger. GitHub cron can run late, so the primary pinger should be an external
# scheduler (see README) hitting the same URL every 10 minutes.
# Set a repository variable RENDER_URL, e.g. https://slate-auth.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        if: ${{ vars.RENDER_URL != '' }}
        run: curl -fsS --max-time 90 "${{ vars.RENDER_URL }}/api/health"
